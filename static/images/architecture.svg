<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background:#f8f9fa">
  <rect x="50" y="50" width="700" height="300" rx="10" fill="white" stroke="#232F3E" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#232F3E">Architecture Diagram</text>
  
  <rect x="100" y="120" width="140" height="80" rx="8" fill="#FF9900" stroke="#cc7700" stroke-width="1.5"/>
  <text x="170" y="155" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">Service A</text>
  <text x="170" y="175" text-anchor="middle" font-family="Arial" font-size="11" fill="white">AWS [Service]</text>

  <line x1="240" y1="160" x2="320" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="320" y="120" width="140" height="80" rx="8" fill="#3F8624" stroke="#2d6219" stroke-width="1.5"/>
  <text x="390" y="155" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">Service B</text>
  <text x="390" y="175" text-anchor="middle" font-family="Arial" font-size="11" fill="white">AWS [Service]</text>

  <line x1="460" y1="160" x2="540" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="540" y="120" width="140" height="80" rx="8" fill="#1A73E8" stroke="#1557b8" stroke-width="1.5"/>
  <text x="610" y="155" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">Service C</text>
  <text x="610" y="175" text-anchor="middle" font-family="Arial" font-size="11" fill="white">AWS [Service]</text>
  
  <text x="400" y="350" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">Thay thế bằng kiến trúc thực tế của workshop bạn</text>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>
